[project]
name = "marimo-pacmap-animation"
version = "0.0.0"
requires-python = "==3.10.*"
dependencies = [
    "numpy==2.2.6",
    "pacmap==0.9.1",
    "matplotlib==3.10.9",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
# Optional GPU renderer (--renderer fastplotlib): enable with
# `uv run --extra fastplotlib ...`. Pinned like the core deps; fastplotlib
# is pre-1.0 and its API churns.
fastplotlib = [
    "fastplotlib==0.6.1",
    "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
