[project]
name = "marimo-pacmap-animation"
version = "0.0.0"
requires-python = "==3.10.*"
dependencies = [
    "numpy==2.2.6",
    "pacmap==0.9.1",
    "matplotlib==3.10.9",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
# Optional GPU renderer (--renderer fastplotlib): enable with
# `uv run --extra fastplotlib python pacmap_animation_mnist.cli.py ...`
# (extras don't apply to PEP 723 script runs, hence the `python`). Pinned
# like the core deps; fastplotlib is pre-1.0 and its API churns.
fastplotlib = [
    "fastplotlib==0.6.1",
    "imageio-ffmpeg==0.6.0",
]
# Optional Polis data source (--dataset polis:<source>): enable with
# `uv run --extra polis python pacmap_animation_mnist.cli.py ...`. Installed
# from the vendored git submodule (see vendor/valency-anndata), which must be
# checked out first: `git submodule update --init`. Unpinned deliberately -
# it's a path dependency on a pinned submodule commit, so the submodule's SHA
# is the version.
polis = [
    "valency-anndata",
]

[tool.uv.sources]
valency-anndata = { path = "vendor/valency-anndata", editable = true }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
